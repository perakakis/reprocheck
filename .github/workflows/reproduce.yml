# Reproducibility check: rebuilds the authors' computing environment as it was
# when the materials were deposited, runs their code unchanged, and renders a
# report with the console transcript, the figures and the session information.
# Several scripts are run in the order listed, each in a fresh R session, so
# they can pass results to one another only through the files they write.
# Two optional jobs use metacheck: `inspect` reads the deposited files before
# anything is run, and `compare` looks for the paper's reported tests in the
# output. They are chosen with the checkboxes under "Run workflow". The
# reproduction never depends on them.
#
# A check starts only from Actions > Reproduce > Run workflow, never from a
# commit: the checker uploads the deposit, fills in settings.env and then
# starts the run, choosing the optional jobs. After the authors correct their
# deposit, the check is run again the same way.
#
# The three values a checker sets per manuscript (R version, CRAN snapshot,
# script or scripts to run) are in settings.env at the root of the repository; this file
# is not edited per manuscript. The code in manuscript/ is never edited: whatever it needs to run is a finding
# for the checklist issue, not a fix.

name: Reproduce

on:
  workflow_dispatch:
    inputs:
      inspect:
        description: "Inspect the deposited files with metacheck"
        type: boolean
        default: true
      compare:
        description: "Compare reported and reproduced results with metacheck (needs paper/manuscript.pdf)"
        type: boolean
        default: false

env:
  # The metacheck used by `inspect` and `compare`.
  # metacheck is beta software that changes weekly, so the version is fixed
  # by commit (0.4.1.13, 2026-10-29).
  METACHECK_REF: "bf36918f6aef5ed55c820baeb8486e4ae56f9fe7"
  # rocker/r-ver:4.6.0's own CRAN copy is frozen at 2026-06-23, too old for
  # metacheck's dependencies (ellmer >= 0.4.2); packages come from the copy
  # of the same day as the metacheck commit.
  METACHECK_CRAN: "2026-10-29"

jobs:
  # Settings ####
  # Reads settings.env, checks each value, and passes them to the jobs that
  # use them; the container of `reproduce` is chosen from R_VERSION here, so
  # the version is written in one place only. A malformed value stops the run
  # with a message before anything is installed. While all three values are
  # blank, as in a repository just made from the template, the run ends here
  # with a notice and the other jobs are skipped.
  settings:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.read.outputs.ready }}
      r_version: ${{ steps.read.outputs.R_VERSION }}
      cran_snapshot: ${{ steps.read.outputs.CRAN_SNAPSHOT }}
      entry_script: ${{ steps.read.outputs.ENTRY_SCRIPT }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and check settings.env
        id: read
        env:
          COMPARE: ${{ inputs.compare }}
        run: |
          # A line may have spaces around the key and the "="; the last line
          # for a key counts.
          get() { { grep -E "^[[:space:]]*$1[[:space:]]*=" settings.env || true; } | tail -n 1 | cut -d= -f2- \
                    | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          R_VERSION=$(get R_VERSION)
          CRAN_SNAPSHOT=$(get CRAN_SNAPSHOT)
          ENTRY_SCRIPT=$(get ENTRY_SCRIPT)
          # A line that is not a comment, blank, or one of the three keys is
          # an error.
          other=$(grep -v -E '^[[:space:]]*(#|$)' settings.env \
                    | grep -v -E '^[[:space:]]*(R_VERSION|CRAN_SNAPSHOT|ENTRY_SCRIPT)[[:space:]]*=' \
                    | paste -s -d ';' - || true)
          if [[ -n "$other" ]]; then
            echo "::error::settings.env has lines that are not R_VERSION=, CRAN_SNAPSHOT= or ENTRY_SCRIPT=: $other"
            exit 1
          fi
          if [[ -z "$R_VERSION$CRAN_SNAPSHOT$ENTRY_SCRIPT" ]]; then
            echo "::notice::settings.env is not filled in yet, so nothing was run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=true
          [[ "$R_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::R_VERSION '$R_VERSION' is not of the form 4.3.1"; ok=false; }
          if [[ "$CRAN_SNAPSHOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            # A real calendar date, from the first day Posit Package Manager
            # keeps a copy of CRAN (2017-10-10) to today.
            python3 -c "import datetime as d, sys; x = d.date.fromisoformat(sys.argv[1]); sys.exit(not d.date(2017, 10, 10) <= x <= d.date.today())" \
              "$CRAN_SNAPSHOT" 2> /dev/null \
              || { echo "::error::CRAN_SNAPSHOT '$CRAN_SNAPSHOT' is not a real date between 2017-10-10 and today"; ok=false; }
          else
            echo "::error::CRAN_SNAPSHOT '$CRAN_SNAPSHOT' is not of the form 2023-10-07"; ok=false
          fi
          # The container for that R version must exist.
          if [[ "$R_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && command -v docker > /dev/null; then
            docker manifest inspect "rocker/r-ver:$R_VERSION" > /dev/null 2>&1 \
              || { echo "::error::R_VERSION '$R_VERSION' has no rocker/r-ver container; check the version against https://cran.r-project.org/src/base/R-4/"; ok=false; }
          fi
          # ENTRY_SCRIPT is one script or a comma-separated list, run in that
          # order; spaces around the commas are dropped, and every script must
          # be a file in manuscript/. The list goes on as "a.R,b.R".
          scripts=""
          IFS=',' read -ra entries <<< "$ENTRY_SCRIPT"
          for s in "${entries[@]}"; do
            s=$(echo "$s" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [[ -z "$s" ]] && continue
            if [[ "$s" == /* || "/$s/" == */../* ]]; then
              echo "::error::ENTRY_SCRIPT '$s' must be a path inside manuscript/, without .. or a leading /"; ok=false
            elif [[ ! -f "manuscript/$s" ]]; then
              echo "::error::ENTRY_SCRIPT '$s' is not a file in manuscript/"; ok=false
            fi
            scripts="${scripts:+$scripts,}$s"
          done
          [[ -n "$scripts" ]] || { echo "::error::ENTRY_SCRIPT names no script"; ok=false; }
          if [[ "$COMPARE" == "true" && ! -f paper/manuscript.pdf ]]; then
            echo "::error::Compare was ticked, but there is no paper/manuscript.pdf"; ok=false
          fi
          $ok
          {
            echo "R_VERSION=$R_VERSION"
            echo "CRAN_SNAPSHOT=$CRAN_SNAPSHOT"
            echo "ENTRY_SCRIPT=$scripts"
            echo "ready=true"
          } | tee -a "$GITHUB_OUTPUT"

  # Inspection ####
  # metacheck reads the files in manuscript/ without running them: inventory,
  # missing files, paths tied to the authors' computer, installation lines,
  # data and codebook checks. It needs current R, so it runs in a job of its
  # own, alongside `reproduce` and independent of it: if it fails, the
  # reproduction still runs. It waits only for `settings`. Nothing is sent out: report_repository() follows
  # no links and downloads nothing, and the language model is switched off.
  inspect:
    needs: settings
    if: needs.settings.outputs.ready == 'true' && inputs.inspect
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6.0
    steps:
      - uses: actions/checkout@v4

      - name: Install metacheck
        run: |
          /rocker_scripts/install_quarto.sh
          Rscript -e '
            options(repos = c(CRAN = paste0("https://p3m.dev/cran/__linux__/noble/", Sys.getenv("METACHECK_CRAN"))))
            install.packages("pak")
            pak::pkg_install(paste0("scienceverse/metacheck@", Sys.getenv("METACHECK_REF")))
          '

      - name: Inspect the deposited files
        run: |
          mkdir -p inspection
          Rscript -e '
            library(metacheck)
            llm_use(FALSE)
            report_repository("manuscript",
                              output_file = "inspection/inspection.html",
                              report_type = "checklist")
          '

      - uses: actions/upload-artifact@v4
        with:
          name: inspection-report
          path: inspection/

  reproduce:
    needs: settings
    if: needs.settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    container: rocker/r-ver:${{ needs.settings.outputs.r_version }}
    env:
      R_VERSION: ${{ needs.settings.outputs.r_version }}
      CRAN_SNAPSHOT: ${{ needs.settings.outputs.cran_snapshot }}
      ENTRY_SCRIPT: ${{ needs.settings.outputs.entry_script }}
    steps:
      - uses: actions/checkout@v4

      # Environment ####
      # Every R session in this job reads this profile, kept outside the copy
      # of the deposit so that a deposited .Rprofile cannot replace it. CRAN
      # is pinned to the snapshot, and any figure the authors' code draws is
      # written as a PNG into run/_reprocheck/ instead of the default
      # Rplots.pdf, named after the script's place in the list, the graphics
      # device and the page (02_figure-01-03.png is the third page of the
      # first device of the second script), so that no figure overwrites
      # another, even after dev.off(). When the run step sets
      # RC_AUTHORS_PROFILE=load, the deposit's own .Rprofile is then loaded,
      # as R would have loaded it on the authors' computer. R would also read
      # a deposited .Renviron at startup, before any profile, and it could
      # replace this one (R_PROFILE_USER); so R is pointed to an empty
      # environment file instead, and a deposited .Renviron is read by this
      # profile, first.
      - name: Pin CRAN snapshot and figure device
        run: |
          mkdir -p run/_reprocheck reprocheck_profile
          # Ready-built packages must match the container's Ubuntu release
          # (jammy for R 4.3 and earlier, noble from R 4.4), read from the system.
          . /etc/os-release
          : > reprocheck_profile/Renviron
          cat > reprocheck_profile/Rprofile <<EOF
          if (file.exists(".Renviron")) readRenviron(".Renviron")
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/${VERSION_CODENAME}/${CRAN_SNAPSHOT}"))
          local({
            device_number <- 0
            options(device = function(...) {
              device_number <<- device_number + 1
              grDevices::png(file.path("${GITHUB_WORKSPACE}", "run", "_reprocheck",
                                       sprintf("%s_figure-%02d-%%02d.png",
                                               Sys.getenv("RC_SCRIPT_NUMBER", "00"), device_number)),
                             width = 1600, height = 1200, res = 200)
            })
          })
          if (identical(Sys.getenv("RC_AUTHORS_PROFILE"), "load") && file.exists(".Rprofile")) source(".Rprofile")
          EOF
          echo "R_PROFILE_USER=${GITHUB_WORKSPACE}/reprocheck_profile/Rprofile" >> "$GITHUB_ENV"
          echo "R_ENVIRON_USER=${GITHUB_WORKSPACE}/reprocheck_profile/Renviron" >> "$GITHUB_ENV"

      # Dependencies ####
      # .github/scripts/find_packages.R reads the deposit's R code and its
      # .Rprofile with R's parser, finds every package loaded with library(),
      # require(), requireNamespace() or loadNamespace() or used as
      # pkg::function(), and installs those from the snapshot, so the
      # versions are those the authors could have had.
      - name: Install the packages the code loads
        run: Rscript .github/scripts/find_packages.R manuscript

      # Run ####
      # The code runs from a copy of manuscript/, so the deposited files stay
      # untouched. Each script runs in its own R session, in the order listed,
      # from the root of that copy, and finds there whatever files the scripts
      # before it wrote. R echoes every command, which gives a transcript a
      # checker can read line by line. A failure is recorded, not fatal: the
      # scripts after it still run and the report is still produced. What
      # reprocheck records goes to run/_reprocheck/, numbered by the script's
      # place in the list: NN_script.txt, NN_transcript.txt, NN_exit_status.txt.
      #
      # Every file a script writes (any file under run/ whose modification
      # time is later than the script's start) is recorded in NN_files.tsv:
      # path, how it compares with the file of the same name in the deposit
      # (new, identical, differs) and size; images, CSV and TSV files are
      # also copied as they were when the script ended, into NN_files/, for
      # the report. Deposited files that no script wrote, code and
      # documentation aside, are listed in not_rewritten.txt: they are
      # inputs, such as the data, or outputs the authors deposited that this
      # run did not produce.
      #
      # A script still running after 60 minutes is stopped (exit status 124),
      # and all the scripts together have five hours: a script that would
      # start after that is not run, so that the report is still produced
      # within GitHub's six-hour limit for a job.
      # The deposit's .Rprofile, if any, is loaded after reprocheck's
      # settings, unless it activates renv: renv's package library is rebuilt
      # from renv.lock, which reprocheck does not do yet, so the packages
      # come from the snapshot and the report says so.
      - name: Run the authors' code
        shell: bash
        run: |
          cp -R manuscript/. run/
          cd run
          rc=_reprocheck
          if [[ -f .Rprofile ]]; then
            # renv is active when a line that is not a comment sources
            # renv/activate.R or calls renv::activate() or renv::load().
            if grep -v -E '^[[:space:]]*#' .Rprofile \
                 | grep -q -E 'renv/activate[.]R|renv::(activate|load)[(]'; then
              profile=renv
            else
              profile=load
            fi
          else
            profile=none
          fi
          echo "$profile" > "$rc/authors_profile.txt"
          [[ -f renv.lock ]] && echo yes > "$rc/renv_lock.txt"
          IFS=',' read -ra scripts <<< "${ENTRY_SCRIPT}"
          failed=""
          n=0
          budget=$(( 5 * 3600 ))
          for s in "${scripts[@]}"; do
            n=$((n + 1))
            nn=$(printf "%02d" "$n")
            echo "$s" > "$rc/${nn}_script.txt"
            touch "$rc/${nn}_start"
            left=$(( budget - SECONDS ))
            if (( left <= 0 )); then
              echo "not run" > "$rc/${nn}_exit_status.txt"
              : > "$rc/${nn}_transcript.txt"
              : > "$rc/${nn}_files.tsv"
              echo "$s: not run, five hours used up"
              failed="${failed:+$failed, }$s (not run, the five hours for all scripts were used up)"
              continue
            fi
            limit=$(( left < 3600 ? left : 3600 ))
            set +e
            RC_SCRIPT_NUMBER="$nn" RC_AUTHORS_PROFILE="$profile" \
              timeout "${limit}s" R --no-save --no-restore < "$s" > "$rc/${nn}_transcript.txt" 2>&1
            status=$?
            set -e
            echo "$status" > "$rc/${nn}_exit_status.txt"
            echo "$s: exit status $status"
            if [[ "$status" -eq 124 ]]; then
              failed="${failed:+$failed, }$s (stopped at the time limit)"
            elif [[ "$status" -ne 0 ]]; then
              failed="${failed:+$failed, }$s"
            fi
            # The files this script wrote.
            : > "$rc/${nn}_files.tsv"
            find . -type f -newer "$rc/${nn}_start" ! -path "./$rc/*" ! -name .Rprofile \
              | sed 's#^\./##' | sort | while IFS= read -r p; do
                if [[ ! -e "../manuscript/$p" ]]; then
                  how="new"
                elif cmp -s "./$p" "../manuscript/$p"; then
                  how="identical to the deposited file"
                elif [[ "$p" =~ [.]([Pp][Dd][Ff]|[Dd][Oo][Cc][Xx]|[Xx][Ll][Ss][Xx]|[Pp][Pp][Tt][Xx])$ ]]; then
                  # These formats record when they were made, so a new copy
                  # never matches byte for byte.
                  how="differs from the deposited file, perhaps only in the date recorded inside it"
                else
                  how="differs from the deposited file"
                fi
                printf '%s\t%s\t%s\n' "$p" "$how" "$(wc -c < "./$p" | tr -d ' ')" >> "$rc/${nn}_files.tsv"
                if [[ "$p" =~ [.]([Pp][Nn][Gg]|[Jj][Pp][Ee]?[Gg]|[Gg][Ii][Ff]|[Ss][Vv][Gg]|[Cc][Ss][Vv]|[Tt][Ss][Vv])$ ]]; then
                  mkdir -p "$rc/${nn}_files/$(dirname "./$p")"
                  cp "./$p" "$rc/${nn}_files/$p"
                fi
              done
          done
          # Deposited files that no script wrote, leaving out code (R, R
          # Markdown, Quarto), documentation (README, licence) and project
          # files (renv, RStudio, git).
          cut -f1 "$rc"/[0-9][0-9]_files.tsv | sort -u > "$rc/written.txt"
          (cd ../manuscript && find . -type f ! -name .gitkeep ! -name .DS_Store \
              ! -iname '*.r' ! -iname '*.rmd' ! -iname '*.qmd' \
              ! -iname 'readme*' ! -iname 'licen[cs]e*' \
              ! -iname '*.rproj' ! -name renv.lock ! -name .Rprofile ! -name .Rhistory ! -name .gitignore \
              ! -path './renv/*' ! -path './.Rproj.user/*' ! -path './.git/*' \
            | sed 's#^\./##' | sort) > "$rc/deposited.txt"
          comm -23 "$rc/deposited.txt" "$rc/written.txt" > "$rc/not_rewritten.txt"
          # The result over all scripts, as the report shows it.
          if [[ -z "$failed" ]]; then
            echo "every script ran to the end without error" > "$rc/result.txt"
          else
            echo "did not run to the end - $failed" > "$rc/result.txt"
          fi
          # R version, platform, and every package installed beyond base R.
          Rscript -e 'print(sessionInfo()); ip <- installed.packages(priority = "NA"); print(ip[, c("Package", "Version")], quote = FALSE, row.names = FALSE)' > "$rc/session_info.txt" 2>&1
          echo "Result: $(cat "$rc/result.txt")"

      # Report ####
      # One section per script, in the order run: its exit status, the files
      # it wrote, its figures (drawn on screen, and saved as image files),
      # its tables (CSV and TSV files it wrote, shown by
      # report/table_preview.R) and its console transcript, written to
      # report/_scripts.md; the deposited files no script wrote to
      # report/_not_rewritten.md; the session information, once, to
      # report/_session_info.md.
      - name: Render the report
        if: always()
        shell: bash
        run: |
          /rocker_scripts/install_quarto.sh
          rc=run/_reprocheck
          # A text file as a code block: the fence is longer than any run of
          # backticks inside the file, and an invisible zero-width space is
          # put between the two braces and the < of every {{<, so that Quarto
          # does not take the text for a shortcode and it is shown as written.
          no_shortcodes() { perl -pe 's/\{\{</{{\xe2\x80\x8b</g'; }
          as_code() {
            local longest fence
            longest=$({ grep -o '`*' "$1" || true; } | awk '{ if (length($0) > n) n = length($0) } END { print n + 0 }')
            fence=$(printf '%*s' $(( longest < 3 ? 3 : longest + 1 )) '' | tr ' ' '`')
            echo "$fence"
            no_shortcodes < "$1"
            echo "$fence"
          }
          as_code "$rc/session_info.txt" > report/_session_info.md
          : > report/_scripts.md
          for f in "$rc"/[0-9][0-9]_script.txt; do
            nn=$(basename "$f" _script.txt)
            s=$(cat "$f")
            files="$rc/${nn}_files.tsv"
            {
              echo "## ${nn#0}. \`$s\`"
              echo
              status=$(cat "$rc/${nn}_exit_status.txt")
              if [[ "$status" == 124 ]]; then
                echo "Exit status: 124. The script was stopped at the time limit (60 minutes for a script, five hours for all)."
              elif [[ "$status" == "not run" ]]; then
                echo "Not run: the five hours for all the scripts were used up before it could start."
              else
                echo "Exit status: $status (0 means the script ran to the end without error)."
              fi
              echo
              echo "### Files written"
              echo
              if [[ -s "$files" ]]; then
                echo "| File | Compared with the deposit | Size (bytes) |"
                echo "|---|---|---:|"
                while IFS=$'\t' read -r p how bytes; do
                  echo "| \`${p//|/\\|}\` | $how | $bytes |"
                done < "$files"
              else
                echo "None."
              fi
              echo
              # Figures drawn on screen, and image files the script saved.
              saved=$(cut -f1 "$files" | grep -i -E '[.](png|jpe?g|gif|svg)$' || true)
              if ls "$rc/${nn}"_figure-*.png > /dev/null 2>&1 || [[ -n "$saved" ]]; then
                # Images as they were when this script ended (NN_files/).
                echo "### Figures"
                echo
                for p in "$rc/${nn}"_figure-*.png; do
                  [[ -e "$p" ]] || continue
                  cp "$p" report/
                  echo "![Drawn on screen]($(basename "$p")){width=80%}"
                  echo
                done
                k=0
                while IFS= read -r p; do
                  [[ -n "$p" ]] || continue
                  k=$((k + 1))
                  copy="${nn}_saved_${k}.${p##*.}"
                  if cp "$rc/${nn}_files/$p" "report/$copy" 2> /dev/null; then
                    echo "![\`$p\`]($copy){width=80%}"
                  else
                    echo "\`$p\` could not be shown."
                  fi
                  echo
                done <<< "$saved"
              fi
              # Figures in formats a web page cannot show; they are in the artifact.
              others=$(cut -f1 "$files" | grep -i -E '[.](pdf|tiff?|eps|ps|bmp)$' || true)
              if [[ -n "$others" ]]; then
                echo "Figures in PDF, TIFF, EPS or BMP format are not shown here; they are in the artifact, under \`run/\`, as the last script left them:"
                echo
                while IFS= read -r p; do echo "- \`$p\`"; done <<< "$others"
                echo
              fi
              # Tables written as CSV or TSV.
              tables=$(cut -f1 "$files" | grep -i -E '[.](csv|tsv)$' || true)
              if [[ -n "$tables" ]]; then
                echo "### Tables"
                echo
                while IFS= read -r p; do
                  echo "\`$p\`"
                  echo
                  Rscript report/table_preview.R "$rc/${nn}_files/$p" | no_shortcodes
                  echo
                done <<< "$tables"
              fi
              echo "### Console transcript"
              echo
              as_code "$rc/${nn}_transcript.txt"
              echo
            } >> report/_scripts.md
          done
          if [[ -s "$rc/not_rewritten.txt" ]]; then
            while IFS= read -r p; do echo "- \`$p\`"; done < "$rc/not_rewritten.txt" > report/_not_rewritten.md
          else
            echo "None: every deposited file other than code and documentation was written by a script." > report/_not_rewritten.md
          fi
          # The deposit's .Rprofile and renv.lock, for the Environment table.
          case "$(cat "$rc/authors_profile.txt")" in
            load) profile="loaded after reprocheck's settings" ;;
            renv) profile="not loaded, because it activates renv, whose package library reprocheck does not yet rebuild from renv.lock; packages came from the CRAN snapshot" ;;
            *)    profile="none in the deposit" ;;
          esac
          if [[ -f "$rc/renv_lock.txt" ]]; then
            renv_lock="present, not yet used; packages came from the CRAN snapshot"
          else
            renv_lock="none in the deposit"
          fi
          cd report
          quarto render report.qmd \
            -M "r-version:${R_VERSION}" \
            -M "cran-snapshot:${CRAN_SNAPSHOT}" \
            -M "entry-script:${ENTRY_SCRIPT//,/, }" \
            -M "result:$(cat "../$rc/result.txt")" \
            -M "authors-profile:${profile}" \
            -M "renv-lock:${renv_lock}"

      # Uploaded even when an earlier step failed, with hidden files.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-report
          include-hidden-files: true
          path: |
            report/report.html
            run/

  # Comparison ####
  # metacheck reads the manuscript and looks for each statistical test it
  # reports in the console output of the `reproduce` job. GROBID, which turns
  # the PDF into text, runs as a container inside this job, so the manuscript
  # is not sent out. metacheck recognises standard tests only (t, F,
  # chi-square, correlations, regression tables); every other number in the
  # paper is left to the checker, and the summary says so.
  compare:
    if: needs.settings.outputs.ready == 'true' && inputs.compare
    needs: [settings, reproduce]
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6.0
    services:
      # The light GROBID image (0.5 GB) of the version metacheck uses; the full
      # image is 10 GB.
      grobid:
        image: grobid/grobid:0.9.0-crf
    steps:
      - uses: actions/checkout@v4

      # The console transcript and the script, from the `reproduce` job.
      - uses: actions/download-artifact@v4
        with:
          name: reproducibility-report

      - name: Install metacheck
        run: |
          Rscript -e '
            options(repos = c(CRAN = paste0("https://p3m.dev/cran/__linux__/noble/", Sys.getenv("METACHECK_CRAN"))))
            install.packages("pak")
            pak::pkg_install(paste0("scienceverse/metacheck@", Sys.getenv("METACHECK_REF")))
          '

      - name: Compare reported and reproduced results
        run: |
          mkdir -p comparison
          Rscript -e '
            library(metacheck)
            llm_use(FALSE)

            # GROBID takes a minute or two to start.
            alive <- FALSE
            for (i in 1:60) {
              alive <- tryCatch(any(grepl("true", readLines("http://grobid:8070/api/isalive", warn = FALSE))),
                                error = function(e) FALSE)
              if (alive) break
              Sys.sleep(5)
            }
            stopifnot(alive)

            # The manuscript, converted inside this job.
            convert_grobid("paper/manuscript.pdf", save_path = "comparison/manuscript.xml",
                           api_url = "http://grobid:8070")
            paper <- read("comparison/manuscript.xml")

            # The results each script printed in the reproduce job, read from
            # its transcript and put together in one table.
            # metacheck skips the output of any statement that starts with
            # print(), which it takes for a look at the data, like head();
            # but scripts often print their results that way, and must do so
            # inside loops and functions. So a statement that is a whole print(...) on one line
            # is read as its argument alone, in copies of the transcript and
            # the script made for metacheck; the files themselves are not
            # changed.
            unprint <- function(x) {
              i <- grepl("^(> )?print[(].*[)][[:space:]]*$", x)
              x[i] <- sub("[)][[:space:]]*$", "", sub("print[(]", "", x[i]))
              x
            }
            rc <- file.path("run", "_reprocheck")
            numbers <- sub("_script[.]txt$", "", list.files(rc, pattern = "^[0-9]{2}_script[.]txt$"))
            outputs <- list()
            for (nn in numbers) {
              script_name <- readLines(file.path(rc, paste0(nn, "_script.txt")), warn = FALSE)
              transcript  <- unprint(readLines(file.path(rc, paste0(nn, "_transcript.txt")), warn = FALSE))
              script      <- unprint(readLines(file.path("run", script_name), warn = FALSE))
              tabs <- read_r_output(transcript, source_label = script_name, code_lines = script)
              cat("Results read from the transcript of", script_name, ":", length(tabs), "\n")
              if (length(tabs)) outputs[[nn]] <- stat_results_long(tabs, source_file = script_name)
            }
            output <- if (length(outputs)) do.call(rbind, outputs) else data.frame()

            # Each reported test looked for in the output.
            matched <- match_reported_output(paper, output, include_tables = TRUE)
            write.csv(matched, "comparison/matches.csv", row.names = FALSE)
            s <- attr(matched, "summary")
            summary_line <- sprintf(paste("metacheck recognised %d statistical tests in the paper and found %d of them",
                                          "in the output (%d fully, %d partly). Every other number in the paper must be",
                                          "checked by hand."),
                                    s$n_tests, s$n_found, s$n_full, s$n_partial)
            writeLines(summary_line, "comparison/summary.txt")
            cat(summary_line, "\n")
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: comparison/
